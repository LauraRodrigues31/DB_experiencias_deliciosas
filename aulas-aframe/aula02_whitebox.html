<!DOCTYPE html>
<!--
  Aula 02 · Whitebox
  O QUE FAZ: rascunho do espaço com formas simples (paredes, alvo, ponto de partida),
  um cubo de 1 m para ter noção de escala e um exemplo de hierarquia (mesa com filhos).
  Convenções: 1 unidade = 1 m; Y para cima; −Z é a frente; a câmera fica a ~1,6 m.
  COMO TESTAR: abra no navegador e ande com WASD. Compare o tamanho das coisas com o
  cubo de 1 m. A mesa vai e volta sozinha: repare que a cesta e a bola (filhas)
  acompanham, embora só o pai esteja sendo movido.
-->
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<a-scene>
  <!-- chão de 14 m × 14 m -->
  <a-plane rotation="-90 0 0" width="14" height="14" color="#D4D9DC"></a-plane>

  <!-- paredes: caixas finas (0,4 m), 2 m de altura, 6 m de profundidade.
       y = 1 porque a posição é o CENTRO da caixa (metade de 2 m) -->
  <a-box position="-3.5 1 -4" width="0.4" height="2" depth="6"></a-box>
  <a-box position="3.5 1 -4" width="0.4" height="2" depth="6"></a-box>

  <!-- alvo e ponto de partida -->
  <a-cylinder id="alvo" position="0 0.4 -5" radius="0.5" height="0.8"></a-cylinder>
  <a-sphere position="0 1.2 -1" radius="0.1" color="#FF4545"></a-sphere>

  <!-- referência de escala: cubo de exatamente 1 m, apoiado no chão (centro em y = 0,5) -->
  <a-box position="-2 0.5 -2" width="1" height="1" depth="1" color="#90A5E5"></a-box>
  <a-text value="1 m" align="center" position="-2 1.2 -2" color="#2E2640"></a-text>

  <!-- hierarquia: #mesa é o pai; tampo, cesta e bola são filhos.
       As posições dos filhos são RELATIVAS à mesa, então mover a mesa move tudo junto.
       A animação mexe só na posição do pai. -->
  <a-entity id="mesa" position="2 0 -2"
            animation="property: position; to: 2 0 -3.5; dir: alternate; loop: true; dur: 2000">
    <!-- tampo a 0,75 m de altura -->
    <a-box position="0 0.75 0" width="1" height="0.05" depth="0.6" color="#8B5E3C"></a-box>
    <!-- cesta em cima do tampo -->
    <a-cylinder position="-0.25 0.875 0" radius="0.15" height="0.2" color="#C9A66B"></a-cylinder>
    <!-- bola em cima do tampo -->
    <a-sphere position="0.25 0.875 0" radius="0.1" color="#FF4545"></a-sphere>
  </a-entity>
</a-scene>
